name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc, cc: gcc, opts: "" }
          - { name: clang-asan-ubsan, cc: clang, opts: "-DTL4_SANITIZE=ON" }
          - { name: clang-fuzz-smoke, cc: clang, opts: "-DTL4_FUZZ=ON" }
    name: linux-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang libclang-rt-18-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} ${{ matrix.opts }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Fuzz smoke run (generated seeds only)
        if: matrix.name == 'clang-fuzz-smoke'
        run: |
          for f in build/*/fuzz_*; do
            [ -x "$f" ] || continue
            name="$(basename "$f")"
            dir="$(find . -path "*/fuzz/seeds/${name#fuzz_}" -type d | head -n 1)"
            "$f" -runs=20000 -max_len=65536 ${dir:+"$dir"}
          done

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
